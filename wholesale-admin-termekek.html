<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesale admin — Termékek</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Bejelentkezés -->
<div id="login-screen" class="flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 w-full max-w-sm">
    <h1 class="text-lg font-semibold mb-4">Wholesale admin</h1>
    <input id="login-email" type="email" placeholder="Email" class="w-full border rounded px-3 py-2 mb-2 text-sm">
    <input id="login-password" type="password" placeholder="Jelszó" class="w-full border rounded px-3 py-2 mb-4 text-sm">
    <button id="login-btn" class="w-full bg-gray-900 text-white rounded py-2 text-sm font-medium">Belépés</button>
    <p id="login-error" class="text-red-600 text-xs mt-2 hidden"></p>
  </div>
</div>

<!-- Admin felület -->
<div id="admin-screen" class="hidden max-w-6xl mx-auto px-4 py-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-lg font-semibold">Wholesale — Termékek</h1>
    <div class="flex gap-2">
      <button id="sync-btn" class="bg-white border border-gray-300 rounded px-3 py-1.5 text-sm">🛍️ Szinkronizálás most</button>
      <button id="logout-btn" class="text-sm text-gray-500">Kilépés</button>
    </div>
  </div>
  <p id="sync-status" class="text-xs text-gray-500 mb-4"></p>

  <div class="bg-white rounded-lg border border-gray-200 overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-200 text-left text-gray-500">
          <th class="px-3 py-2 font-medium">Látható</th>
          <th class="px-3 py-2 font-medium">SKU</th>
          <th class="px-3 py-2 font-medium">Termék</th>
          <th class="px-3 py-2 font-medium">Készlet</th>
          <th class="px-3 py-2 font-medium">MOQ</th>
          <th class="px-3 py-2 font-medium">Ársávok (mennyiség → ár)</th>
        </tr>
      </thead>
      <tbody id="product-rows"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, doc, updateDoc, orderBy, query
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ⚠️ Illeszd be ugyanazt a firebaseConfig blokkot, amit az app.andyourstories.com
  // index.html / alapanyagok.html fájlja is használ (ays-production-5ab41 projekt).
  const firebaseConfig = {
    apiKey: "AIzaSyBKEAA01f16INT22nX2fSV8YGOfB3fDuMw",
    authDomain: "ays-production-5ab41.firebaseapp.com",
    projectId: "ays-production-5ab41",
    storageBucket: "ays-production-5ab41.firebasestorage.app",
    messagingSenderId: "642343737324",
    appId: "1:642343737324:web:2a2f1bd9455cb83a2752c9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Admin e-mail whitelist — vedd fel Márti címét is
  const ADMIN_EMAILS = ["juraj.german@andyourstories.com"];

  // Cloud Function URL — a deploy után írd ide a tényleges Cloud Run URL-t
  const SYNC_FUNCTION_URL = "https://wholesale-shopify-sync-642343737324.europe-west1.run.app";

  const loginScreen = document.getElementById("login-screen");
  const adminScreen = document.getElementById("admin-screen");
  const loginError = document.getElementById("login-error");

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginError.textContent = `Hiba: ${err.code || err.message}`;
      loginError.classList.remove("hidden");
      console.error("Bejelentkezési hiba:", err);
    }
  });

  document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user && ADMIN_EMAILS.includes(user.email)) {
      loginScreen.classList.add("hidden");
      adminScreen.classList.remove("hidden");
      listenToProducts();
    } else {
      if (user) signOut(auth); // bejelentkezett, de nincs jogosultsága
      loginScreen.classList.remove("hidden");
      adminScreen.classList.add("hidden");
    }
  });

  function listenToProducts() {
    const q = query(collection(db, "wholesaleProducts"), orderBy("title"));
    onSnapshot(
      q,
      (snapshot) => {
        const tbody = document.getElementById("product-rows");
        tbody.innerHTML = "";
        snapshot.forEach((docSnap) => {
          tbody.appendChild(renderRow(docSnap.id, docSnap.data()));
        });
      },
      (err) => {
        console.error("Firestore olvasási hiba:", err);
        document.getElementById("sync-status").textContent = `Firestore hiba: ${err.code || err.message}`;
      }
    );
  }

  function renderRow(sku, data) {
    const tr = document.createElement("tr");
    tr.className = "border-b border-gray-100";

    const priceTiers = data.priceTiers || [];
    const tiersText = priceTiers.map(t => `${t.minQty}+ → ${t.price}`).join(", ");

    tr.innerHTML = `
      <td class="px-3 py-2">
        <input type="checkbox" class="visible-toggle w-4 h-4" ${data.visible ? "checked" : ""}>
      </td>
      <td class="px-3 py-2 font-mono text-xs">${sku}</td>
      <td class="px-3 py-2">${data.title || ""}</td>
      <td class="px-3 py-2 text-gray-500">${data.stock ?? "-"}</td>
      <td class="px-3 py-2">
        <input type="number" class="moq-input w-16 border rounded px-2 py-1 text-sm" value="${data.moq ?? 1}" min="1">
      </td>
      <td class="px-3 py-2">
        <input type="text" class="tiers-input w-64 border rounded px-2 py-1 text-sm"
               value="${tiersText}" placeholder="pl. 12+ → 2500, 24+ → 2200">
      </td>
    `;

    const docRef = doc(db, "wholesaleProducts", sku);

    tr.querySelector(".visible-toggle").addEventListener("change", (e) => {
      updateDoc(docRef, { visible: e.target.checked });
    });

    tr.querySelector(".moq-input").addEventListener("change", (e) => {
      updateDoc(docRef, { moq: parseInt(e.target.value, 10) || 1 });
    });

    tr.querySelector(".tiers-input").addEventListener("change", (e) => {
      const parsed = parseTiersInput(e.target.value);
      updateDoc(docRef, { priceTiers: parsed });
    });

    return tr;
  }

  // "12+ → 2500, 24+ → 2200" formátum feldolgozása [{minQty, price}] tömbbé
  function parseTiersInput(text) {
    if (!text.trim()) return [];
    return text.split(",").map(part => {
      const match = part.trim().match(/(\d+)\+?\s*(?:→|->|:)\s*(\d+(?:\.\d+)?)/);
      if (!match) return null;
      return { minQty: parseInt(match[1], 10), price: parseFloat(match[2]) };
    }).filter(Boolean).sort((a, b) => a.minQty - b.minQty);
  }

  document.getElementById("sync-btn").addEventListener("click", async () => {
    const status = document.getElementById("sync-status");
    status.textContent = "Szinkronizálás folyamatban...";
    try {
      const res = await fetch(SYNC_FUNCTION_URL);
      const text = await res.text();
      status.textContent = text;
    } catch (err) {
      status.textContent = "Hiba a szinkronizálás közben: " + err.message;
    }
  });
</script>

</body>
</html>
